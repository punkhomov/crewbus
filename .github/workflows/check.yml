name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Bootstrap verified pnpm 12.6.0
        run: |
          node scripts/bootstrap-pnpm.mjs "$RUNNER_TEMP/crewbus-pnpm"
          echo "$RUNNER_TEMP/crewbus-pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-ui-provenance.mjs
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: node scripts/docker-smoke.mjs
